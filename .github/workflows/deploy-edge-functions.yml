name: Deploy Supabase Edge Functions

# 🚨 INCIDENT 2026-05-21 : sans ce workflow, mes commits sur supabase/functions/**
# (V3.4.19, V3.4.20, V3.4.21) sont restés dormants dans le repo. La prod tournait
# avec une version cassée pendant des jours sans qu'on s'en rende compte. Ce
# workflow déploie automatiquement TOUTE edge function modifiée à chaque push
# sur main.
#
# Setup requis (1 fois) :
# 1. Créer un access token Supabase : https://supabase.com/dashboard/account/tokens
# 2. Ajouter en GitHub secret : Settings → Secrets → Actions → New :
#    - SUPABASE_ACCESS_TOKEN  = le token créé
#    - SUPABASE_PROJECT_REF   = vhrhgsqxwvouswjaiczn (projet VMD/GMC)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch: # Permet de redéployer manuellement depuis l'UI GitHub
    inputs:
      functions:
        description: "Fonctions à redéployer, séparées par des espaces. Vide = celles modifiées au dernier commit."
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2 # On a besoin du commit précédent pour calculer le diff

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Identify changed edge functions
        id: changed
        env:
          # ⚠️ L'entrée passe par l'ENVIRONNEMENT, jamais par `${{ }}` dans le
          # script : interpolée directement, elle permettrait d'injecter une
          # commande shell. Elle est en plus validée ci-dessous contre les
          # répertoires réellement présents.
          FORCER: ${{ inputs.functions }}
        run: |
          # Échappatoire de rattrapage : redéployer des fonctions nommées à la
          # main, quand le correctif dont elles dépendent est déjà committé
          # (le diff HEAD~1..HEAD ne le verrait plus).
          if [ -n "$FORCER" ]; then
            VALIDES=""
            for fn in $FORCER; do
              if [ -d "supabase/functions/$fn" ] && [ "${fn#_}" = "$fn" ]; then
                VALIDES="$VALIDES $fn"
              else
                echo "::error::Fonction inconnue ou interdite : $fn"
                exit 1
              fi
            done
            echo "Functions to deploy (forcé) :$VALIDES"
            echo "functions=$VALIDES" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Liste les répertoires modifiés sous supabase/functions/ entre HEAD~1 et HEAD
          # Sur push initial (pas de HEAD~1), déploie TOUT.
          # NB : `|| true` indispensable. Le shell GHA tourne en `bash -e -o pipefail`.
          # Quand un commit ne touche QUE `supabase/functions/_shared/**` (ou rien sous
          # functions/), `grep -v '^_'` ne matche rien -> exit 1 -> pipefail+errexit tuent
          # l'etape (faux echec rouge). Le `|| true` neutralise ce cas : CHANGED reste vide
          # -> skip=true -> workflow vert. (Incident 2026-06-15 : commit _shared-only.)
          #
          # 🚨 INCIDENT 2026-09-21 : le `|| true` ci-dessus a bien supprimé le faux
          # ÉCHEC ROUGE du cas « _shared seul », mais personne n'a vu que le SUCCÈS
          # VERT était faux lui aussi. Modifier `_shared/vmd-emails.ts` (les 7
          # gabarits e-mail) affichait « Functions to deploy: » VIDE, workflow vert,
          # et RIEN n'était déployé — alors que **24 des 29 fonctions importent un
          # fichier de `_shared/`**. Un correctif partagé pouvait donc rester
          # dormant indéfiniment, exactement l'incident de mai que ce workflow
          # existe pour empêcher.
          # ⚠️ `_shared` n'est PAS une fonction : on ne la déploie jamais elle-même.
          # Ce qu'il faut redéployer, ce sont les fonctions qui l'IMPORTENT.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            MODIFIES=$(git diff --name-only HEAD~1 HEAD -- 'supabase/functions/' || true)

            # (a) fonctions dont le code propre a changé
            DIRECTES=$(printf '%s\n' "$MODIFIES" \
              | awk -F'/' '{print $3}' \
              | grep -v '^_' \
              | grep -v '^$' \
              | sort -u || true)

            # (b) fonctions qui importent un fichier de `_shared/` modifié
            DEPENDANTES=""
            for f in $(printf '%s\n' "$MODIFIES" | grep '^supabase/functions/_shared/' || true); do
              base=$(basename "$f" .ts)
              echo "  fichier partagé modifié : $base"
              trouve=$(grep -rl "_shared/$base" supabase/functions --include='*.ts' 2>/dev/null \
                | grep -v '/_shared/' \
                | awk -F'/' '{print $3}' \
                | sort -u || true)
              DEPENDANTES="$DEPENDANTES $trouve"
            done

            CHANGED=$(printf '%s %s' "$DIRECTES" "$DEPENDANTES" \
              | tr ' ' '\n' \
              | grep -v '^$' \
              | sort -u \
              | tr '\n' ' ' || true)
          else
            CHANGED=$(ls supabase/functions/ \
              | grep -v '^_' \
              | tr '\n' ' ' || true)
          fi
          echo "Functions to deploy: $CHANGED"
          echo "functions=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy changed functions
        if: steps.changed.outputs.skip == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # 2026-09-07 — le secret SUPABASE_PROJECT_REF a disparu des réglages
          # du dépôt : `--project-ref ""` donnait « Cannot find project ref »
          # et DEUX déploiements sont passés à l'échec sans que personne ne le
          # voie (05/09 et 07/09) — le correctif de réputation est resté hors
          # production jusqu'à un déploiement manuel.
          #
          # La référence de projet n'est pas un secret : elle figure en clair
          # dans chaque migration, dans CLAUDE.md et dans l'URL Supabase servie
          # au navigateur. En faire un secret n'apportait aucune protection et
          # créait un point de panne unique. Le secret reste prioritaire s'il
          # est présent, sinon on retombe sur la valeur connue.
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'vhrhgsqxwvouswjaiczn' }}
        run: |
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::PROJECT_REF vide — déploiement impossible."
            exit 1
          fi
          echo "Déploiement sur le projet $PROJECT_REF"
          for fn in ${{ steps.changed.outputs.functions }}; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "::group::Deploying $fn"
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
              echo "::endgroup::"
            else
              echo "Skipping $fn (not a directory)"
            fi
          done

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.changed.outputs.skip }}" = "true" ]; then
            echo "✅ No edge function changed, nothing to deploy."
          else
            echo "✅ Deployed: ${{ steps.changed.outputs.functions }}"
          fi
