name: Vercel Deploy (via Deploy Hook)

# Pourquoi : Vercel Hobby refuse de construire les commits dont l'auteur GitHub
# n'est pas membre du compte (repo privé) → les push de Johan finissaient BLOCKED.
# Le Deploy Hook est autorisé par le propriétaire du compte, donc il déclenche un
# build QUEL QUE SOIT l'auteur du commit. Transparent pour tout le monde : on push
# sur main comme d'habitude, cette Action appelle le hook, Vercel construit.

on:
  push:
    branches: [main]

# Un seul déploiement à la fois ; un push plus récent annule le précédent.
concurrency:
  group: vercel-deploy-hook
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret VERCEL_DEPLOY_HOOK_URL absent — déploiement non déclenché."
            echo "À faire une fois : Vercel → newdevis → Settings → Git → Deploy Hooks → créer un hook sur 'main',"
            echo "puis GitHub → Settings → Secrets and variables → Actions → nouveau secret VERCEL_DEPLOY_HOOK_URL."
            exit 0
          fi
          echo "Appel du Deploy Hook Vercel…"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "Réponse Vercel : HTTP $code"
          case "$code" in
            200|201) echo "✅ Déploiement déclenché.";;
            *) echo "::error::Le Deploy Hook a répondu HTTP $code (URL invalide/expirée ?)"; exit 1;;
          esac
